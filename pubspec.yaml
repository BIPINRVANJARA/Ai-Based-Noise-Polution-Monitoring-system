name: noiseguard
description: "NoiseGuard - AI-Powered Smart Noise Intelligence Platform"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # State Management
  flutter_riverpod: ^2.6.1

  # Navigation
  go_router: ^14.8.1

  # Firebase
  firebase_core: ^3.12.1
  firebase_auth: ^5.5.1
  cloud_firestore: ^5.6.5
  firebase_database: ^11.3.1
  firebase_messaging: ^15.2.4
  firebase_storage: ^12.4.4

  # Maps
  google_maps_flutter: ^2.10.0

  # Charts
  fl_chart: ^0.70.2

  # PDF
  pdf: ^3.11.1
  printing: ^5.13.4

  # Typography
  google_fonts: ^6.2.1

  # Location
  geolocator: ^13.0.2
  geocoding: ^3.0.0

  # Formatting
  intl: ^0.19.0

  # Local Storage
  shared_preferences: ^2.3.4

  # Notifications
  flutter_local_notifications: ^18.0.1

  # Animations
  shimmer: ^3.0.0

  # UUID
  uuid: ^4.5.1

  # URL Launcher
  url_launcher: ^6.3.1

  # Share
  share_plus: ^10.1.4

  # Path Provider
  path_provider: ^2.1.5
  google_generative_ai: ^0.4.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
